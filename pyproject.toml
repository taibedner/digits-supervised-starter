[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digits-supervised-starter"
version = "0.1.0"
description = "A small, Japanese-documented supervised image-classification learning project."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "taibedner"}]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
digits-starter = "digits_starter.cli:main"

[project.urls]
Repository = "https://github.com/taibedner/digits-supervised-starter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

